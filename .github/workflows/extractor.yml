name: Extracción Automática de Datos

on:
  schedule:
    # Red de seguridad: el disparo principal lo hace el Cron Trigger de Cloudflare (más puntual que el cron de GitHub).
    - cron: '23 */6 * * *'
  workflow_dispatch: # <--- BOTÓN PARA LANZARLO A MANO

jobs:
  extraer:
    # Si existe la variable RUNNER (p. ej. "madrid"), corre en tu VM con IP española; si no, en GitHub.
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Permiso para hacer push

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Necesario para Git

      - name: Instalar dependencias
        run: |
          python3 -m venv ~/venv-liga
          ~/venv-liga/bin/pip install -q requests beautifulsoup4 pdfplumber pywebpush

      - name: Guardar copia de los datos anteriores (para detectar cambios)
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          cp -f datos_liga.json datos_canal.json "$RUNNER_TEMP/old/" 2>/dev/null || true

      - name: Ejecutar el extractor
        env:
          PYTHONUNBUFFERED: "1"   # el log se ve en directo
          ECM_PROXY: ${{ secrets.ECM_PROXY }}   # opcional: proxy con IP española solo para ECM
          ECM_WORKER: ${{ secrets.ECM_WORKER }}        # opcional: Worker de Cloudflare con IP española
          ECM_WORKER_KEY: ${{ secrets.ECM_WORKER_KEY }}
        run: ~/venv-liga/bin/python extractor.py

      - name: Enviar avisos push (si algo cambió en tus equipos)
        continue-on-error: true   # un fallo de avisos nunca debe romper la extracción
        env:
          PYTHONUNBUFFERED: "1"
          ECM_WORKER: ${{ secrets.ECM_WORKER }}
          ECM_WORKER_KEY: ${{ secrets.ECM_WORKER_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: ~/venv-liga/bin/python notificar_push.py "$RUNNER_TEMP/old"

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "bot@ligafutbol.com"
          git config --local user.name "LigaFutbol Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Actualización automática por GitHub Actions"
          git pull --rebase --autostash origin main || true
          git push
