name: Extracción Automática de Datos

on:
  schedule:
    # Se ejecuta cada 30 minutos
    - cron: '*/20 * * * *'
  workflow_dispatch: # <--- BOTÓN PARA LANZARLO A MANO

jobs:
  extraer:
    runs-on: ubuntu-24.04          # ← ANTES: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Permiso para hacer push

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Necesario para Git

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Ejecutar el extractor
        run: python extractor.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "bot@ligafutbol.com"
          git config --local user.name "LigaFutbol Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Actualización automática por GitHub Actions"
          git push
