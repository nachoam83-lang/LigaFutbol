name: Probar Worker de Cloudflare

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL del Worker"
        required: true
        default: "https://ecm-probe.nachoam83.workers.dev/"

jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - name: Llamar al Worker desde GitHub (IP de EEUU)
        env:
          URL: ${{ inputs.url }}
        run: |
          URL="$(echo "$URL" | tr -d '[:space:]')"
          echo "URL usada: [$URL]"
          echo "IP de GitHub:"; curl -sS -m 20 https://api.country.is || true; echo
          for i in 1 2 3; do
            echo "--- intento $i"
            curl -sS -m 30 -w '\nHTTP %{http_code}\n' "$URL" || echo "curl fallo con codigo $?"
            sleep 3
          done
